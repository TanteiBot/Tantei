version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      timezone: "Etc/UTC"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/Tantei.Client"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"