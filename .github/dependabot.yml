version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      timezone: "Etc/UTC"
    cooldown:
      exclude:
        - "Microsoft.*"
        - "System.*"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/Tantei.Client"
    schedule:
      interval: "weekly"
      day: "saturday"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      oxlint:
        patterns:
          - "oxlint"
          - "eslint-plugin-oxlint"
      npm-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "oxfmt"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"