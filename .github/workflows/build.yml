name: .NET build

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - master
      - release/*
      - main
      - dotnet/*
  pull_request:
    branches:
      - dev
      - master
      - release/*
      - main
      - dotnet/*

env:
  DOTNET_NOLOGO: true
  artifact-name: "build-${{ github.sha }}"
  clientapp-dir: "./src/PaperMalKing/ClientApp"
  node-version: '24.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      output-dir: "./output"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Install .NET SDK if needed
        uses: actions/setup-dotnet@v6
          
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }} 
    
      - name: Install deps
        run: dotnet restore

      - name: Build projects
        run: dotnet build ./src/PaperMalKing/PaperMalKing.csproj --configuration Release --no-restore --output ${{ env.output-dir }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact-name }}
          path: ${{ env.output-dir }}
          if-no-files-found: error
          retention-days: 1

  test:
    strategy:
      matrix:
        configuration: ['Release', 'Debug']
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install .NET SDK if needed
        uses: actions/setup-dotnet@v6

      - name: Test
        #run: dotnet test --logger GitHubActions "${t}" -c ${{ matrix.configuration }}
        run: dotnet test -c ${{ matrix.configuration }}

  codeQl:
    name: Run CodeQL analysis
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install .NET SDK if needed
        uses: actions/setup-dotnet@v6
          
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: 'csharp'
          queries: security-and-quality
          config: |
            build-mode: manual
            query-filters:
              - exclude:
                  id: cs/call-to-unmanaged-code
              - exclude:
                  id: cs/unmanaged-code
              - exclude:
                  id: cs/useless-assignment-to-local

      - name: Build .NET
        run: for p in $(find ./src -type d \( -path ./src/PaperMalKing.Database.Migrations -o -path ./src/PaperMalKing.Database.CompiledModels \) -prune -o -name '*.csproj' -print); do dotnet build $p; done
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6