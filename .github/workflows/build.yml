name: .NET build
name: .NET build

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - master
      - release/*
      - main
      - dotnet/*
  pull_request:
    branches:
      - dev
      - master
      - release/*
      - main
      - dotnet/*

env:
  DOTNET_NOLOGO: true
  artifact-name: "build-${{ github.sha }}"
  clientapp-dir: "./src/Tantei.Client"
  node-version: '24.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      output-dir: "./output"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Install .NET SDK if needed
        uses: actions/setup-dotnet@v6
          
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }} 
    
      - name: Install deps
        run: dotnet restore

      - name: Build projects
        run: dotnet build ./src/PaperMalKing/PaperMalKing.csproj --configuration Release --no-restore --output ${{ env.output-dir }}

      - name: Check committed OpenAPI document is current
        run: |
          if ! git diff --exit-code -- src/Tantei.Client/openapi.json; then
            echo "::error::openapi.json is out of date. Run 'dotnet build ./src/PaperMalKing/PaperMalKing.csproj' and 'npm run generate:api' in src/Tantei.Client, then commit both files."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact-name }}
          path: ${{ env.output-dir }}
          if-no-files-found: error
          retention-days: 1

  client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: Install client deps
        working-directory: ${{ env.clientapp-dir }}
        run: npm ci

      - name: Check formatting
        working-directory: ${{ env.clientapp-dir }}
        run: npm run format:check

      - name: Lint client
        working-directory: ${{ env.clientapp-dir }}
        run: npm run lint:check

      - name: Type-check and build client
        working-directory: ${{ env.clientapp-dir }}
        run: npm run build

      - name: Build Storybook
        working-directory: ${{ env.clientapp-dir }}
        run: npm run build-storybook

  test:
    strategy:
      matrix:
        configuration: ['Release', 'Debug']
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install .NET SDK if needed
        uses: actions/setup-dotnet@v6

      - name: Test
        #run: dotnet test --logger GitHubActions "${t}" -c ${{ matrix.configuration }}
        run: dotnet test -c ${{ matrix.configuration }}

  codeQl:
    name: Run CodeQL analysis
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install .NET SDK if needed
        uses: actions/setup-dotnet@v6
          
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: 'csharp'
          queries: security-and-quality
          config: |
            query-filters:
              - exclude:
                  id: cs/call-to-unmanaged-code
              - exclude:
                  id: cs/unmanaged-code

      - name: Build .NET
        run: dotnet build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6

  inferSharp:
    name: Run Infer#
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.artifact-name }}

      - run: mkdir ./createdDlls && mv PaperMalKing* createdDlls

      - name: Run Infer#
        id: runInferSharp
        uses: microsoft/infersharpaction@v1.5
        with:
          binary-path: "./createdDlls"

      - name: Upload SARIF output to GitHub Security Center
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: infer-out/report.sarif
